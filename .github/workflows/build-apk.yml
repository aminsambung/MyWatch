name: Build My Watch APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip -o MyWatch_Mode_HP.zip -d extracted

      - name: Fix Java and Kotlin versions
        run: |
          find extracted -name build.gradle.kts \
            -path '*/app/*' -print

      - name: Build APK
        run: |
          cd extracted
          GRADLEW=$(find . -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "Gradle wrapper tidak ditemukan"
            exit 1
          fi
          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyWatch-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
