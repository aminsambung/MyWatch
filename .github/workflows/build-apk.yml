name: Build My Watch APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Mengambil kode proyek
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Menyiapkan Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Menyiapkan Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. Menyiapkan Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Memasang SDK
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 6. Mengekstrak proyek
      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o MyWatch_Mode_HP.zip -d extracted

          echo "Isi proyek:"
          find extracted -maxdepth 4 -type f

      # 7. Mencari folder proyek Android
      - name: Find Android project
        id: project
        run: |
          PROJECT=$(find extracted \
            -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "File settings.gradle tidak ditemukan"
            exit 1
          fi

          DIR=$(dirname "$PROJECT")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

          echo "Folder proyek: $DIR"

      # 8. Memperbaiki izin Gradle Wrapper
      - name: Prepare Gradle
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "Gradle Wrapper ditemukan"
          else
            echo "Gradle Wrapper tidak ada"
            echo "Akan menggunakan Gradle 8.9"
          fi

      # 9. Membangun APK
      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      # 10. Mengunggah APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyWatch-APK
          path: |
            extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
