name: Build MyWatch APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check Project
        run: |
          echo "Memeriksa struktur proyek..."

          ls -la

          if [ ! -f "settings.gradle.kts" ] && \
             [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle tidak ditemukan"
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ] && \
             [ ! -f "app/build.gradle" ]; then
            echo "ERROR: build.gradle di folder app tidak ditemukan"
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyWatch-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
